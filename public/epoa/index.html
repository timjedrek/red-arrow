<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#AE2126">
<title>Red Arrow ePOA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{color-scheme:light dark; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  --bg:#F4F2ED; --surface:#FFFFFF; --surface-2:#EBE7DF; --surface-3:#E1DCD2;
  --text:#15191C; --text-2:#48525A; --text-3:#7A848C;
  --line:#D8D2C7; --line-2:#BFB7A9;
  --accent:#AE2126; --accent-2:#8E1A1F; --accent-soft:#F7E6E4;
  --g3:#2C7355; --g3-soft:#E3EFE9;
  --g2:#9A6A0C; --g2-soft:#F7EDD8;
  --g1:#AE2126; --g1-soft:#F8E4E3;
  --focus:#1D5E8C;
  --shadow:0 1px 2px rgba(20,25,28,.06), 0 8px 24px -12px rgba(20,25,28,.14);
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans:"IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --disp:"Archivo", "IBM Plex Sans", sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101315; --surface:#181C1F; --surface-2:#22272B; --surface-3:#2C3237;
    --text:#E9E5DD; --text-2:#AFB7BD; --text-3:#818B92;
    --line:#2E353A; --line-2:#414A51;
    --accent:#E8565B; --accent-2:#F07A7E; --accent-soft:#3A1E20;
    --g3:#6BC49B; --g3-soft:#1D3229;
    --g2:#DDA93F; --g2-soft:#332A15;
    --g1:#E8565B; --g1-soft:#3A1E20;
    --focus:#69AEDC;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#101315; --surface:#181C1F; --surface-2:#22272B; --surface-3:#2C3237;
  --text:#E9E5DD; --text-2:#AFB7BD; --text-3:#818B92;
  --line:#2E353A; --line-2:#414A51;
  --accent:#E8565B; --accent-2:#F07A7E; --accent-soft:#3A1E20;
  --g3:#6BC49B; --g3-soft:#1D3229;
  --g2:#DDA93F; --g2-soft:#332A15;
  --g1:#E8565B; --g1-soft:#3A1E20;
  --focus:#69AEDC;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 28px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:var(--sans); font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px}
h1,h2,h3,h4{font-family:var(--disp); font-weight:700; margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
.app{display:flex; flex-direction:column; min-height:100%}

/* ---------- top bar ---------- */
.bar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--surface); border-bottom:1px solid var(--line);
  padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
}
.mark{display:flex; align-items:center; gap:9px; margin-right:auto; min-width:0}
.mark svg{flex:none}
.mark b{font-family:var(--disp); font-weight:800; font-size:14px; letter-spacing:.06em; text-transform:uppercase; white-space:nowrap}
.mark span{font-size:11.5px; color:var(--text-3); letter-spacing:.04em; text-transform:uppercase; display:block; margin-top:-2px}
.clock{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:19px; font-weight:500; letter-spacing:-.02em}
.clock small{display:block; font-family:var(--sans); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-3); font-weight:600}
.recpill{
  display:inline-flex; align-items:center; gap:7px; padding:5px 11px 5px 9px;
  border-radius:999px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase;
  background:var(--surface-2); color:var(--text-2); border:1px solid var(--line);
}
.recpill.on{background:var(--accent-soft); color:var(--accent); border-color:var(--accent)}
.recpill.hold{background:var(--g2-soft); color:var(--g2); border-color:var(--g2)}
.dot{width:8px; height:8px; border-radius:50%; background:currentColor; flex:none}
.recpill.on .dot{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.recpill.on .dot{animation:none}}

/* ---------- buttons ---------- */
.btn{
  border:1px solid var(--line-2); background:var(--surface); color:var(--text);
  border-radius:8px; padding:8px 14px; font-size:14px; font-weight:600; cursor:pointer;
  display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
}
.btn:hover{border-color:var(--text-3)}
.btn.primary{background:var(--text); color:var(--bg); border-color:var(--text)}
.btn.primary:hover{opacity:.88}
.btn.rec{background:var(--accent); color:#fff; border-color:var(--accent)}
:root[data-theme="dark"] .btn.rec, :root:not([data-theme="light"]) .btn.rec{color:#1A0A0B}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn.rec{color:#fff}}
.btn.ghost{background:transparent; border-color:transparent; color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2); border-color:transparent}
.btn.sm{padding:5px 10px; font-size:13px}
.btn[disabled]{opacity:.42; cursor:not-allowed}

/* ---------- layout ---------- */
.wrap{width:100%; max-width:1180px; margin:0 auto; padding:0 16px; padding-block:22px}
.wrap.narrow{max-width:760px}
.shell{display:grid; grid-template-columns:238px minmax(0,1fr); gap:26px; align-items:start}
@media (max-width:860px){ .shell{grid-template-columns:1fr; gap:14px} }

/* ---------- section nav ---------- */
.nav{position:sticky; top:calc(env(safe-area-inset-top,0px) + 74px)}
.nav ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:2px}
.nav button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  padding:8px 10px; border-radius:7px; display:flex; gap:9px; align-items:baseline;
  color:var(--text-2); font-size:13.5px; line-height:1.35;
}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="true"]{background:var(--surface); color:var(--text); font-weight:600; box-shadow:inset 2px 0 0 var(--accent)}
.nav .n{font-family:var(--mono); font-size:11px; color:var(--text-3); flex:none; width:16px}
.nav .st{margin-left:auto; font-size:11px; font-family:var(--mono); color:var(--text-3)}
.nav button.done .st{color:var(--g3)}
@media (max-width:860px){
  .nav{position:static; overflow-x:auto; -webkit-overflow-scrolling:touch; border-bottom:1px solid var(--line); padding-bottom:6px}
  .nav ol{flex-direction:row; gap:6px}
  .nav button{white-space:nowrap; width:auto; border:1px solid var(--line); background:var(--surface)}
  .nav button[aria-current="true"]{box-shadow:none; border-color:var(--accent)}
  .nav .st{margin-left:6px}
}

/* ---------- cards ---------- */
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:16px 18px; box-shadow:var(--shadow)}
.stack{display:flex; flex-direction:column; gap:12px}
.eyebrow{font-size:10.5px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--text-3)}
.sechead{margin-bottom:14px}
.sechead h2{font-size:24px; margin-top:3px}
.sechead p{color:var(--text-2); font-size:14px; margin-top:6px; max-width:64ch}

.item{background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:14px 16px}
.item.graded{border-left:3px solid var(--line-2)}
.item.g3{border-left-color:var(--g3)} .item.g2{border-left-color:var(--g2)} .item.g1{border-left-color:var(--g1)}
.item h3{font-size:15.5px; font-family:var(--sans); font-weight:600; letter-spacing:0}
.item .det{color:var(--text-2); font-size:13.5px; margin-top:5px}
.item ul{margin:7px 0 0; padding-left:18px; color:var(--text-2); font-size:13.5px}
.item ul li{margin:2px 0}
.std{display:inline-block; font-family:var(--mono); font-size:12px; background:var(--surface-2); border:1px solid var(--line); border-radius:6px; padding:2px 7px; margin-top:8px; color:var(--text-2)}

.qbank{margin-top:10px; border-top:1px dashed var(--line); padding-top:10px}
.qbank .qhead{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px}
.qbank .qhead .eyebrow{letter-spacing:.1em}
.pickcount{font-family:var(--mono); font-size:11.5px; padding:1px 7px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-2)}
.pickcount.ok{background:var(--g3-soft); border-color:var(--g3); color:var(--g3)}
.qlist{display:flex; flex-direction:column; gap:1px}
label.q{display:flex; gap:9px; align-items:flex-start; font-size:13.5px; color:var(--text-2); padding:4px 6px; border-radius:6px; cursor:pointer}
label.q:hover{background:var(--surface-2)}
label.q input{margin:3px 0 0}
label.q.on{color:var(--text)}

label.chk{display:flex; gap:10px; align-items:flex-start; padding:7px 8px; border-radius:8px; cursor:pointer}
label.chk:hover{background:var(--surface-2)}
label.chk input{margin:4px 0 0; flex:none}
label.chk .lb{font-size:14px}
label.chk .sub{font-size:13px; color:var(--text-2); display:block; margin-top:2px}
label.chk.on .lb{color:var(--text-3); text-decoration:line-through; text-decoration-thickness:1px}

.grades{display:flex; gap:6px; margin-top:11px; flex-wrap:wrap; align-items:center}
.gbtn{
  border:1px solid var(--line-2); background:var(--surface); border-radius:8px; cursor:pointer;
  padding:6px 11px; font-size:13px; font-weight:600; display:inline-flex; gap:7px; align-items:baseline;
}
.gbtn b{font-family:var(--mono); font-size:14px}
.gbtn:hover{border-color:var(--text-3)}
.gbtn[aria-pressed="true"][data-g="3"]{background:var(--g3-soft); border-color:var(--g3); color:var(--g3)}
.gbtn[aria-pressed="true"][data-g="2"]{background:var(--g2-soft); border-color:var(--g2); color:var(--g2)}
.gbtn[aria-pressed="true"][data-g="1"]{background:var(--g1-soft); border-color:var(--g1); color:var(--g1)}
textarea.note{
  width:100%; margin-top:10px; min-height:44px; resize:vertical;
  background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13.5px;
}
textarea.note:focus{background:var(--surface)}
input.f, select.f, textarea.f{
  width:100%; background:var(--bg); border:1px solid var(--line-2); border-radius:8px; padding:9px 11px; font-size:14px;
}
input.f:focus,select.f:focus,textarea.f:focus{background:var(--surface)}
.field{display:flex; flex-direction:column; gap:5px}
.field label{font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--text-3)}
.grid2{display:grid; grid-template-columns:1fr 1fr; gap:12px}
@media (max-width:620px){.grid2{grid-template-columns:1fr}}

.note-read{background:var(--surface-2); border-radius:8px; padding:10px 12px; font-size:13.5px; color:var(--text-2); border:1px solid var(--line)}
.scenario{background:var(--surface-2); border:1px solid var(--line); border-left:3px solid var(--accent); border-radius:10px; padding:14px 16px}
.scenario p{font-size:14.5px; line-height:1.6}
.scenario p+p{margin-top:9px}

/* ---------- phase picker ---------- */
.phases{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:12px}
.pcard{text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:15px; cursor:pointer; display:flex; flex-direction:column; gap:4px}
.pcard:hover{border-color:var(--text-3)}
.pcard[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent)}
.pcard .code{font-family:var(--mono); font-size:11.5px; color:var(--accent); font-weight:600; letter-spacing:.04em}
.pcard h3{font-size:17px; font-family:var(--disp)}
.pcard .meta{font-size:12.5px; color:var(--text-3); margin-top:4px}

/* ---------- misc ---------- */
.banner{border-radius:10px; padding:11px 14px; font-size:13.5px; display:flex; gap:10px; align-items:flex-start}
.banner.warn{background:var(--g2-soft); border:1px solid var(--g2); color:var(--g2)}
.banner.bad{background:var(--g1-soft); border:1px solid var(--g1); color:var(--g1)}
.banner.info{background:var(--surface-2); border:1px solid var(--line); color:var(--text-2)}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.spacer{flex:1}
.hr{height:1px; background:var(--line); border:0; margin:18px 0}
table.t{width:100%; border-collapse:collapse; font-size:13.5px}
table.t th{text-align:left; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--text-3); padding:0 10px 7px 0; font-weight:700}
table.t td{padding:8px 10px 8px 0; border-top:1px solid var(--line); vertical-align:top}
table.t tr td:last-child, table.t tr th:last-child{padding-right:0}
.tw{overflow-x:auto}
.chip{display:inline-flex; align-items:center; gap:5px; font-family:var(--mono); font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--text-2)}
.chip.g3{background:var(--g3-soft); border-color:var(--g3); color:var(--g3)}
.chip.g2{background:var(--g2-soft); border-color:var(--g2); color:var(--g2)}
.chip.g1{background:var(--g1-soft); border-color:var(--g1); color:var(--g1)}
.foot{position:sticky; bottom:0; z-index:30; background:var(--surface); border-top:1px solid var(--line); padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px)); display:flex; gap:10px; align-items:center}
.prog{flex:1; min-width:80px; height:5px; background:var(--surface-3); border-radius:99px; overflow:hidden}
.prog i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s ease}
@media (prefers-reduced-motion:reduce){.prog i{transition:none}}
.mini{font-size:12px; color:var(--text-3); font-family:var(--mono)}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}
.aud{display:flex; flex-direction:column; gap:8px}
.aud .seg{display:flex; gap:10px; align-items:center; font-size:13px; flex-wrap:wrap}
.aud audio{height:34px; max-width:100%}
/* ---------- ACS element grading ---------- */
.item.acst{padding:14px 14px 12px}
.acsh{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:4px}
.acsh h3{font-size:15.5px}
details.grp{border-top:1px solid var(--line); margin-top:8px}
details.grp>summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:9px; padding:8px 2px 8px 0; font-size:12.5px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--text-2)}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸"; font-size:10px; color:var(--text-3); transition:transform .15s ease}
details.grp[open]>summary::before{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){details.grp>summary::before{transition:none}}
details.grp>summary:hover{color:var(--text)}
.cnt{font-family:var(--mono); font-size:11.5px; font-weight:500; padding:1px 6px; border-radius:5px; background:var(--surface-2); border:1px solid var(--line); color:var(--text-3); letter-spacing:0}
.cnt.ok{background:var(--g3-soft); border-color:var(--g3); color:var(--g3)}
.els{display:flex; flex-direction:column; gap:2px; padding:2px 0 8px}
.el{border-radius:8px; padding:7px 8px 7px 9px; border-left:2px solid transparent; background:var(--bg)}
.el:hover{background:var(--surface-2)}
.el.g3{border-left-color:var(--g3)} .el.g2{border-left-color:var(--g2)} .el.g1{border-left-color:var(--g1)}
.el.ktel{background:var(--g2-soft); box-shadow:inset 0 0 0 1px var(--g2)}
.elb{display:flex; gap:9px; align-items:flex-start}
.elc{font-family:var(--mono); font-size:11.5px; font-weight:600; color:var(--text-3); flex:none; min-width:30px; padding-top:1px}
.el.g3 .elc{color:var(--g3)} .el.g2 .elc{color:var(--g2)} .el.g1 .elc{color:var(--g1)}
.elt{font-size:13.5px; line-height:1.45; min-width:0}
.elt ul.subs{margin:5px 0 0; padding-left:16px; color:var(--text-2); font-size:13px}
.elt ul.subs li{margin:1px 0}
.elt ul.subs b{font-family:var(--mono); font-size:11.5px}
.elkt{font-family:var(--mono); font-size:11px; color:var(--g2); font-weight:600; margin-top:4px; text-transform:uppercase; letter-spacing:.04em}
.elg{display:flex; gap:5px; align-items:center; margin:7px 0 0 39px; flex-wrap:wrap}
.gb{font-family:var(--mono); font-size:12.5px; font-weight:600; width:30px; height:26px; border-radius:6px;
  border:1px solid var(--line-2); background:var(--surface); color:var(--text-2); cursor:pointer}
.gb:hover{border-color:var(--text-3); color:var(--text)}
.gb[data-g="3"][aria-pressed="true"]{background:var(--g3); border-color:var(--g3); color:var(--bg)}
.gb[data-g="2"][aria-pressed="true"]{background:var(--g2); border-color:var(--g2); color:var(--bg)}
.gb[data-g="1"][aria-pressed="true"]{background:var(--g1); border-color:var(--g1); color:var(--bg)}
.elg .nb{font-size:12px; padding:3px 8px}
textarea.elnote{margin:7px 0 2px 39px; width:calc(100% - 39px)}
/* ---------- statistics ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px}
.tile{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; box-shadow:var(--shadow)}
.tile .big{font-size:30px; margin:4px 0 2px}
.gstack{display:flex; flex-direction:column; gap:9px}
.grow{display:grid; grid-template-columns:110px 1fr 120px; gap:11px; align-items:center}
.drow{display:grid; grid-template-columns:minmax(0,1fr) 140px 120px; gap:11px; align-items:center}
.dlab{font-size:13.5px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sbar{display:block; height:9px; background:var(--surface-3); border-radius:99px; overflow:hidden}
.sbar i{display:block; height:100%; border-radius:99px; background:var(--text-3)}
.sbar i.good{background:var(--g3)} .sbar i.warn{background:var(--g2)} .sbar i.bad{background:var(--g1)}
@media (max-width:620px){
  .grow{grid-template-columns:100px 1fr; }
  .grow .mini{grid-column:2}
  .drow{grid-template-columns:1fr}
  .dlab{white-space:normal}
}
.crow{display:flex; gap:11px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line)}
.crow:first-of-type{border-top:0}
.crow .ic{width:22px; height:22px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:12px; font-weight:700; font-family:var(--mono);
  background:var(--surface-3); color:var(--text-3); margin-top:1px}
.crow.ok .ic{background:var(--g3-soft); color:var(--g3); box-shadow:inset 0 0 0 1px var(--g3)}
.crow.bad .ic{background:var(--g1-soft); color:var(--g1); box-shadow:inset 0 0 0 1px var(--g1)}
.crow.warn .ic{background:var(--g2-soft); color:var(--g2); box-shadow:inset 0 0 0 1px var(--g2)}
.crow .bd{min-width:0; flex:1}
.crow b{font-size:14px; font-weight:600}
.crow p{font-size:13px; color:var(--text-2); margin-top:3px}
.crow ol{font-size:13px; color:var(--text-2); margin:7px 0 0; padding-left:20px}
.crow ol li{margin:3px 0}
.meter{height:9px; border-radius:99px; background:var(--surface-3); overflow:hidden; margin-top:9px; max-width:280px}
.meter i{display:block; height:100%; width:0%; background:var(--g3); border-radius:99px}
details.help{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:0 16px; box-shadow:var(--shadow)}
details.help>summary{cursor:pointer; padding:14px 0; font-weight:600; font-size:14.5px; list-style:none; display:flex; align-items:center; gap:8px}
details.help>summary::-webkit-details-marker{display:none}

<script>
/* =====================================================================
   Red Arrow ePOA — standalone plumbing
   Records go to a Google Sheet and ground audio to a Google Drive folder,
   both owned by the school, through one Apps Script web app.

   >>> EDIT THIS ONE LINE after you deploy the Apps Script (see SETUP.md).
   ===================================================================== */
window.EPOA_CONFIG = {
  api: 'https://script.google.com/macros/s/AKfycbx8xP_e6M74O8E3_dKQuaCvpqkZ-YSnNl6up40ewwRvPH6N86DJ-fFBtGpmKBrEwTTv9A/exec',
  school: 'Red Arrow Flight Academy'
};

const Api = {
  ok: false,
  err: '',
  url(){
    try { return (localStorage.getItem('epoa.api') || window.EPOA_CONFIG.api || '').trim(); }
    catch(e){ return (window.EPOA_CONFIG.api||'').trim(); }
  },
  setUrl(u){ try { localStorage.setItem('epoa.api', (u||'').trim()); } catch(e){} },
  pin(){ try { return localStorage.getItem('epoa.pin') || ''; } catch(e){ return ''; } },
  setPin(p){ try { localStorage.setItem('epoa.pin', (p||'').trim()); } catch(e){} },

  /* Apps Script has no CORS preflight support, so the body is sent as
     text/plain — that keeps the request "simple" and no preflight is made.
     The 302 to googleusercontent.com is followed by fetch and that response
     does carry Access-Control-Allow-Origin. */
  async call(action, payload){
    const url = Api.url();
    if (!url) throw {code:'no_api'};
    const body = JSON.stringify(Object.assign({action:action, pin:Api.pin()}, payload||{}));
    let r;
    try {
      r = await fetch(url, {
        method:'POST', redirect:'follow', cache:'no-store',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: body
      });
    } catch(e){ Api.err = 'No network answer from the records service.'; throw {code:'offline'}; }
    const txt = await r.text();
    let j = null;
    try { j = JSON.parse(txt); } catch(e){
      Api.err = 'The records service answered with something unexpected. Check that the web app is deployed with access set to "Anyone".';
      throw {code:'bad_response'};
    }
    if (!j.ok){
      Api.err = j.message || ('Records service error: '+(j.error||'unknown'));
      throw {code:j.error||'error'};
    }
    Api.err = '';
    return j;
  }
};

function blobToB64(blob){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { const s = String(fr.result); res(s.slice(s.indexOf(',')+1)); };
    fr.onerror = () => rej({code:'read_error'});
    fr.readAsDataURL(blob);
  });
}

function saveBlob(blob, filename){
  try {
    const u = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = u; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(u), 30000);
  } catch(e){}
}

  const a = sec.items.filter(i=>i.type==='acstask');
  const c = sec.items.filter(i=>i.type==='check'||i.type==='qrcheck');
  const tg = t.every(i => s.grades[i.id]);
  const ag = a.every(i => { const n = itemCounts(s,i); return n.done === n.total; });
  const cc = c.every(i => s.checks[i.id]);
  if (secKtPending(s, sec)) return false;
  return (t.length||a.length||c.length) ? (tg && ag && cc) : true;
}
function progress(s){
  const t = gradables(s);
  const done = t.filter(i=>s.grades[i.id]).length;
  return {done, total:t.length, pct: t.length? Math.round(done/t.length*100):0};
}

/* ===================== recorder ===================== */
const Rec = {
  stream:null, mr:null, chunks:[], mime:'', seq:0, state:'off',
  segStart:0, restart:false, rotate:null, pauseAt:0, recMs:0
};
function pickMime(){
  const c = ['audio/webm;codecs=opus','audio/webm','audio/mp4','audio/ogg;codecs=opus'];
  if (typeof MediaRecorder === 'undefined') return '';
  for (const m of c) { try { if (MediaRecorder.isTypeSupported(m)) return m; } catch(e){} }
  return '';
}
function assetType(mime){
  /* the asset store accepts container types, not audio/* — an audio-only
     webm/mp4 file is a valid container and plays back fine. */
  if (mime.indexOf('mp4')>-1) return 'video/mp4';
  return 'video/webm';
}
async function recStart(){
  if (Rec.state !== 'off') return true;
  Rec.mime = pickMime();
  if (!Rec.mime || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    logEv('audio_unavailable','This browser/view cannot record audio'); return false;
  }
  try { Rec.stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true, noiseSuppression:true}}); }
  catch(e){ logEv('audio_blocked','Microphone permission denied or unavailable'); return false; }
  Rec.state='rec'; beginSeg(); return true;
}
function beginSeg(){
  Rec.chunks=[]; Rec.segStart=Date.now();
  try {
    Rec.mr = new MediaRecorder(Rec.stream, {mimeType:Rec.mime, audioBitsPerSecond:24000});
  } catch(e){
    try { Rec.mr = new MediaRecorder(Rec.stream); } catch(e2){ logEv('audio_unavailable','Recorder failed to start'); Rec.state='off'; return; }
  }
  Rec.mr.ondataavailable = e => { if (e.data && e.data.size) Rec.chunks.push(e.data); };
  Rec.mr.onstop = () => {
    const blob = new Blob(Rec.chunks, {type:Rec.mime}); Rec.chunks=[];
    const ms = Date.now()-Rec.segStart; Rec.recMs += ms;
    if (Rec.restart && Rec.state==='rec') beginSeg();
    if (blob.size > 1000) storeSeg(blob, ms);
  };
  Rec.mr.start(2000);
  clearTimeout(Rec.rotate);
  Rec.rotate = setTimeout(()=>{ if (Rec.state==='rec') endSeg(true); }, SEG_MS);
}
function endSeg(restart){
  clearTimeout(Rec.rotate); Rec.restart = !!restart;
  try { if (Rec.mr && Rec.mr.state !== 'inactive') Rec.mr.stop(); } catch(e){}
}
async function storeSeg(blob, ms){
  const seq = ++Rec.seq;
  const row = {seq, startedAt:new Date(Date.now()-ms).toISOString(), ms, bytes:blob.size};
  LocalAudio[seq] = blob;
  if (Api.url()){
    try {
      const b64 = await blobToB64(blob);
      const name = [St.s.date, (St.s.applicant||'applicant').replace(/[^A-Za-z0-9]+/g,'-'), St.s.poaCode.replace(/[^A-Za-z0-9]+/g,'-'), 'seg'+seq].join('_')
        + (Rec.mime.indexOf('mp4')>-1 ? '.m4a' : '.webm');
      const r = await Api.call('audio', {data:b64, name, mime:(Rec.mime.indexOf('mp4')>-1?'audio/mp4':'audio/webm'), sessionId:St.s.id, seq});
      row.drive = r.id; row.link = r.link; row.bytes = r.bytes || blob.size;
    } catch(e){
      row.failed = (e && e.code) || 'upload_error';
      flash('Segment '+seq+' did not reach Drive ('+row.failed+'). Download it from the debrief screen before closing this page.','warn');
    }
  } else { row.local = true; }
  St.s.audio.push(row); save(true);
  if (St.view==='done') render(); else if (St.view==='run') patchBar();
}
function recPause(){
  if (Rec.state!=='rec') return;
  Rec.state='paused'; Rec.pauseAt=Date.now(); endSeg(false);
  logEv('pause','Ground portion paused — 5:00 limit running');
  render();
}
function recResume(auto){
  if (Rec.state!=='paused') return;
  const held = Date.now()-Rec.pauseAt;
  Rec.state='rec'; Rec.pauseAt=0;
  logEv(auto?'auto_resume':'resume', (auto?'Auto-resumed at the 5:00 limit':'Resumed')+' after '+mmss(held));
  if (auto) St.s.autoResumes = (St.s.autoResumes||0)+1;
  beginSeg(); render();
}
function recStopAll(reason){
  if (Rec.state==='off') return;
  const wasPaused = Rec.state==='paused';
  Rec.state='off'; clearTimeout(Rec.rotate);
  if (!wasPaused) endSeg(false);
  try { if (Rec.stream) Rec.stream.getTracks().forEach(t=>t.stop()); } catch(e){}
  Rec.stream=null;
  logEv('ground_end', reason||'Ground portion recording ended');
}
function logEv(type, detail){
  if (!St.s) return;
  St.s.events.push({t:new Date().toISOString(), type, detail:detail||''});
  save();
}

async function testMic(){
  if (Chk.testing) return;
  stopMeter();
  Chk.testing = true; Chk.mic='asking'; Chk.err=''; renderChk();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){
    Chk.testing = false;
    const n = (e && e.name) || '';
    if (n==='NotAllowedError' || n==='SecurityError'){
      let st = '';
      try { if (navigator.permissions) st = (await navigator.permissions.query({name:'microphone'})).state; } catch(err){}
      Chk.mic = (st==='denied' || st==='prompt') ? (st==='denied' ? 'denied' : 'framed') : 'denied';
    }
    else if (n==='NotFoundError' || n==='OverconstrainedError') Chk.mic='nomic';
    else if (n==='NotReadableError' || n==='AbortError') Chk.mic='busy';
    else Chk.mic='denied';
    renderChk(); return;
  }
  Chk.testing = false; Chk.mic='ok'; Chk.stream = stream;
  try { const t = stream.getAudioTracks()[0]; Chk.label = (t && t.label) || ''; } catch(e){}
  try { localStorage.setItem('epoa.micok','1'); } catch(e){}
  renderChk();
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    Chk.ac = new AC();
    const src = Chk.ac.createMediaStreamSource(stream);
    const an = Chk.ac.createAnalyser(); an.fftSize = 1024;
    src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    const started = Date.now();
    const tick = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0;
      for (let i=0;i<buf.length;i++){ const v = Math.abs(buf[i]-128)/128; if (v>peak) peak=v; }
      Chk.level = Math.min(1, peak*2.2);
      const bar = $('#lvl'); if (bar) bar.style.width = Math.round(Chk.level*100)+'%';
      if (Date.now()-started < 12000) Chk.raf = requestAnimationFrame(tick); else stopMeter();
    };
    tick();
  } catch(e){ stopMeter(); }
}
function stopMeter(){
  if (Chk.raf) cancelAnimationFrame(Chk.raf);
  Chk.raf = null; Chk.level = 0;
  try { if (Chk.ac) Chk.ac.close(); } catch(e){}
  Chk.ac = null;
  try { if (Chk.stream) Chk.stream.getTracks().forEach(t=>t.stop()); } catch(e){}
  Chk.stream = null;
}

/* ground time is start → End ground; flight time is End ground → End event.
   Both are wall clock, so they include breaks; the audio total doesn't. */
function splitTimes(s){
  const t0 = s.startedAt ? new Date(s.startedAt).getTime() : 0;
  const tg = s.groundEndedAt ? new Date(s.groundEndedAt).getTime() : 0;
  const t1 = s.endedAt ? new Date(s.endedAt).getTime() : Date.now();
  const ground = t0 ? (tg ? tg - t0 : t1 - t0) : 0;
  const flight = (tg && s.endedAt) ? t1 - tg : (tg ? Date.now() - tg : 0);
  return {ground: Math.max(0, ground), flight: Math.max(0, flight), total: Math.max(0, t1 - t0)};
}
function endEvent(){
  const s = St.s;
  recStopAll('Ground recording stopped at end of event');
  s.groundEndedAt = s.groundEndedAt || new Date().toISOString();
  s.endedAt = new Date().toISOString();
  s.status = 'debrief';
  const sp = splitTimes(s);
  s.groundMs = sp.ground; s.flightMs = sp.flight;
  s.recMs = Rec.recMs;
  s.events.push({t:s.endedAt, type:'end', detail:'Event ended'});
  St.view='done'; save(true); render();
}

   statistics are only as good as the spelling */
function recNames(){
  const seen = {};
  (St.list||[]).forEach(r => { const n = (r.recInstructor||'').trim(); if (n) seen[n] = 1; });
  return Object.keys(seen).sort();
}
/* ===================== statistics ===================== */
/* every gradable id in the app, mapped to a readable label, built once */
let LBL = null;
function labelFor(id){
  if (!LBL){
    LBL = {};
    POAS.forEach(p => p.sections.forEach(sec => sec.items.forEach(it => {
      if (it.type === 'task') LBL[it.id] = p.code+' · '+it.label;
      else if (it.type === 'acstask') (it.els||[]).forEach(e => {
        LBL[elId(it.acs, e[0])] = it.acs+'.'+e[0]+' — '+e[1];
      });
    })));
  }
  return LBL[id] || id;
}
const statRows = () => (St.list||[]).filter(r => r && r.status && r.status !== 'draft');
function statsFilter(rows){
  const days = +(St.stPeriod||0);
  const ph = St.stPhase || '';
  const cut = days ? Date.now() - days*864e5 : 0;
  return rows.filter(r => {
    if (ph && r.poa !== ph) return false;
    if (cut){ const t = Date.parse(r.startedAt || r.date || ''); if (!t || t < cut) return false; }
    return true;
  });
}
function tally(rows){
  const t = {n:rows.length, out:{Satisfactory:0, Retest:0, Discontinuance:0, pending:0}, g:{1:0,2:0,3:0}, def:{}, people:{}, cis:{}, applicants:{}};
  rows.forEach(r => {
    t.out[r.outcome && t.out[r.outcome]!==undefined ? r.outcome : (r.outcome||'pending')] =
      (t.out[r.outcome] !== undefined ? t.out[r.outcome] : t.out.pending) + 1;
    if (r.outcome && t.out[r.outcome] === undefined) t.out[r.outcome] = 1;
    const grades = r.grades || {};
    Object.keys(grades).forEach(id => {
      const g = grades[id];
      if (g===1||g===2||g===3) t.g[g]++;
      if (g===1||g===2){
        const d = t.def[id] = t.def[id] || {id, one:0, two:0};
        if (g===1) d.one++; else d.two++;
      }
    });
    const bucket = (map, key) => {
      const k = (key||'').trim() || '— not recorded —';
      const b = map[k] = map[k] || {name:k, n:0, sat:0, ret:0, dis:0, ones:0, twos:0};
      b.n++;
      if (r.outcome === 'Satisfactory') b.sat++;
      else if (r.outcome === 'Retest') b.ret++;
      else if (r.outcome === 'Discontinuance') b.dis++;
      Object.keys(grades).forEach(id => { if (grades[id]===1) b.ones++; else if (grades[id]===2) b.twos++; });
      return b;
    };
    bucket(t.people, r.recInstructor);
    bucket(t.cis, r.instructor);
    bucket(t.applicants, r.applicant);
  });
  return t;
}
function bar(pct, kind){
  return '<span class="sbar"><i class="'+(kind||'')+'" style="width:'+Math.max(0, Math.min(100, pct))+'%"></i></span>';
}
function peopleTable(map, who){
  const rows = Object.keys(map).map(k=>map[k]).sort((a,b)=>b.n-a.n);
  if (!rows.length) return '<p class="mini">Nothing recorded yet.</p>';
  return '<div class="tw"><table class="t"><thead><tr><th>'+esc(who)+'</th><th>Checks</th><th>Satisfactory</th><th>Retest</th><th>Disc.</th><th>Pass rate</th><th>Avg 1s</th><th>Avg 2s</th></tr></thead><tbody>'+
    rows.map(r=>{
      const decided = r.sat + r.ret + r.dis;
      const pct = decided ? Math.round(r.sat/decided*100) : 0;
      return '<tr><td>'+esc(r.name)+'</td><td>'+r.n+'</td><td>'+r.sat+'</td><td>'+r.ret+'</td><td>'+r.dis+'</td>'+
        '<td style="min-width:120px">'+(decided? bar(pct,'good')+' <span class="mini">'+pct+'%</span>' : '<span class="mini">—</span>')+'</td>'+
        '<td>'+(r.n? (r.ones/r.n).toFixed(1):'0')+'</td><td>'+(r.n? (r.twos/r.n).toFixed(1):'0')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
}
function statsHTML(){
  const all = statRows(), rows = statsFilter(all), t = tally(rows);
  const graded = t.g[1]+t.g[2]+t.g[3];

  const decided = t.out.Satisfactory + t.out.Retest + t.out.Discontinuance;
  const passRate = decided ? Math.round(t.out.Satisfactory/decided*100) : 0;
  const defs = Object.keys(t.def).map(k=>t.def[k]).sort((a,b)=> (b.one*3+b.two) - (a.one*3+a.two)).slice(0,15);
  const worst = defs.length ? Math.max.apply(null, defs.map(d=>d.one*3+d.two)) : 1;

    '<div class="row" style="margin-bottom:16px">'+

      '<select class="f" style="max-width:190px" data-sf="stPeriod"><option value="">All time</option>'+
        [[90,'Last 90 days'],[180,'Last 6 months'],[365,'Last 12 months']].map(o=>'<option value="'+o[0]+'"'+(String(St.stPeriod)===String(o[0])?' selected':'')+'>'+o[1]+'</option>').join('')+'</select>'+
      '<span class="spacer"></span><button class="btn sm ghost" data-act="home">Back to records</button>'+
    '</div>'+
    (rows.length ? '' : '<div class="banner info" style="margin-bottom:14px"><span>No finished phase checks match this filter yet.</span></div>')+
    '<div class="tiles">'+
      tile('Phase checks', rows.length, decided+' with an outcome')+
      tile('Pass rate', passRate+'%', t.out.Satisfactory+' satisfactory of '+decided)+
      tile('Items graded', graded, rows.length? (graded/rows.length).toFixed(0)+' per check':'')+
      tile('Graded 3', pctOf(t.g[3])+'%', t.g[3]+' of '+graded)+
    '</div>'+
    '<div class="card" style="margin-top:14px"><span class="eyebrow">How items were graded</span>'+
      '<div class="gstack" style="margin-top:10px">'+
        [[3,'Pass','good'],[2,'Minor','warn'],[1,'Retest','bad']].map(x=>
          '<div class="grow"><span class="chip g'+x[0]+'">'+x[0]+' '+x[1]+'</span>'+bar(pctOf(t.g[x[0]]), x[2])+
          '<span class="mini">'+t.g[x[0]]+' · '+pctOf(t.g[x[0]])+'%</span></div>').join('')+
      '</div>'+
      '<div class="row" style="margin-top:12px; gap:16px">'+
        '<span class="mini">Outcomes: Satisfactory '+t.out.Satisfactory+' · Retest '+t.out.Retest+' · Discontinuance '+t.out.Discontinuance+
        (t.out.pending? ' · not yet finalized '+t.out.pending : '')+'</span></div>'+
    '</div>'+
    '<div class="card" style="margin-top:14px"><span class="eyebrow">By recommending instructor</span>'+
      '<p class="mini" style="margin:5px 0 10px">Whose students arrive ready. Avg 1s is the average number of items needing retest per check.</p>'+
      peopleTable(t.people, 'Recommending instructor')+'</div>'+

      '<p class="mini" style="margin:5px 0 10px">Wide differences in pass rate or average 1s usually mean the standard is being applied differently, not that the students differ.</p>'+
      peopleTable(t.cis, 'Check instructor')+'</div>'+
    '<div class="card" style="margin-top:14px"><span class="eyebrow">Most common deficiencies</span>'+
      '<p class="mini" style="margin:5px 0 10px">Ranked by grade 1s, then 2s. This is the curriculum feedback — what the school keeps missing.</p>'+
      (defs.length? '<div class="gstack">'+defs.map(d=>
        '<div class="drow"><span class="dlab">'+esc(labelFor(d.id))+'</span>'+
        bar((d.one*3+d.two)/worst*100, 'bad')+
        '<span class="mini">'+d.one+' retest'+(d.two? ' · '+d.two+' minor':'')+'</span></div>').join('')+'</div>'
        : '<p class="mini">No deficiencies recorded.</p>')+
    '</div>'+
    '<div class="card" style="margin-top:14px"><span class="eyebrow">By applicant</span>'+
      peopleTable(t.applicants, 'Applicant')+'</div>'+

  keys.sort((a,b)=>{
    const ia = secs.findIndex(x=>x.items.some(i=>i.acs===a)), ib = secs.findIndex(x=>x.items.some(i=>i.acs===b));
    return ia-ib || a.localeCompare(b);
  });
  const un = ktUnmatched(s);
  const total = (s.ktd||[]).length, cov = ktCovered(s);
  const asked = s.ktAsked||{};
  let out = '<div class="kt">'+
    '<div class="field"><label for="kt-paste">Codes from the airman knowledge test report</label>'+

      (total? '<span class="mini">'+total+' code'+(total>1?'s':'')+' · '+keys.length+' task'+(keys.length===1?'':'s')+' flagged · '+cov+'/'+total+' asked</span>'+
              '<span class="spacer"></span><button class="btn sm ghost" data-act="ktclear">Clear all</button>' : '<span class="mini">nothing entered yet</span>')+
    '</div>';
  if (keys.length){
    out += '<div class="stack" style="gap:8px; margin-top:4px">'+keys.map(k=>{
      const info = ACS_INDEX[k], rows = m[k];
      const pend = rows.filter(r=>!asked[r.code]).length;
      return '<div class="ktgroup"><div class="row" style="gap:9px">'+
        '<span class="chip g2">'+esc(k)+'</span><b style="font-size:14px">'+esc(info.t)+'</b>'+
        '<span class="spacer"></span>'+
        (pend? '<span class="chip g2">'+pend+' to ask</span>' : '<span class="chip g3">asked</span>')+
        '<button class="btn sm" data-act="gosec" data-sid="acs'+esc(info.area)+'">Area '+esc(info.area)+'</button>'+
        '<button class="btn sm ghost" data-act="ktdeltask" data-tk="'+esc(k)+'">Remove</button></div>'+
        '<div class="mini" style="margin-top:5px">'+rows.map(r=>esc(r.code)).join(' · ')+'</div></div>';
    }).join('')+'</div>';
  }
  if (un.length){
    out += '<div class="banner warn" style="margin-top:6px"><span><b>Unmatched:</b> '+un.map(r=>esc(r.code)).join(', ')+
      ' — no ACS task in this list carries that area and task letter. Check the code, or ask it under the closest task.'+
      ' <button class="btn sm ghost" data-act="ktdelun">Remove these</button></span></div>';
  }
  return out+'</div>';
}

function runHTML(){
  const s = St.s, secs = sectionsFor(s), sec = secs[St.sec];
  St._ktm = ktMap(s); St._kte = ktElements(s);
  const nav = '<nav class="nav" aria-label="Sections"><ol>'+secs.map((x,i)=>{
    const d = secDone(s,x), kp = secKtPending(s,x);
    return '<li><button data-act="sec" data-i="'+i+'" aria-current="'+(i===St.sec?'true':'false')+'" class="'+(d?'done':'')+'">'+
      '<span class="n">'+(i+1)+'</span><span>'+esc(x.title)+'</span><span class="st">'+(kp?'<span class="ktdot" title="'+kp+' knowledge test question(s) to ask">'+kp+'</span>':(d?'✓':''))+'</span></button></li>';
  }).join('')+'</ol></nav>';

  let body = '<div class="sechead"><span class="eyebrow">'+esc(s.poaCode+' · '+s.poaName+(sec.kind==='ground'?' · recorded':''))+'</span><h2>'+esc(sec.title)+'</h2>'+
    (sec.lead?'<p>'+esc(sec.lead)+'</p>':'')+'</div>';
  if (sec.scenario) body += '<div class="scenario" style="margin-bottom:14px">'+sec.scenario.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div>';
  if (sec.kind==='ktd'){
    body += '<div class="card" style="margin-bottom:12px">'+ktdHTML(s)+'</div>';
    if (!(s.ktd||[]).length) body += '<div class="banner info" style="margin-bottom:12px"><span>Nothing entered. If the knowledge test report shows no missed codes, tick it off in Documents &amp; Administrative and move on.</span></div>';
  }
  if (sec.acs){
    const kp = secKtPending(s, sec);
    if (kp) body += '<div class="banner warn" style="margin-bottom:12px"><span>'+kp+' knowledge test deficiency question'+(kp>1?'s':'')+' must be asked in this area — the flagged tasks are marked below.</span></div>';
  }
  body += '<div class="stack">'+sec.items.map(it=>itemHTML(s,it)).join('')+'</div>';

  const pr = progress(s);
  const foot = '<button class="btn" data-act="prev"'+(St.sec===0?' disabled':'')+'>Back</button>'+
    '<div class="prog" role="progressbar" aria-valuenow="'+pr.pct+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+pr.pct+'%"></i></div>'+
    '<span class="mini">'+pr.done+'/'+pr.total+' graded</span>'+
    (St.sec<secs.length-1 ? '<button class="btn primary" data-act="next">Next</button>' : '<button class="btn primary" data-act="endevent">End event</button>');
  return {main:'<div class="wrap"><div class="shell">'+nav+'<div>'+body+'</div></div></div>', foot};
}

    '<div class="card"><span class="eyebrow">Event log</span><div class="tw" style="margin-top:8px"><table class="t"><tbody>'+
      (s.events||[]).map(e=>'<tr><td class="mini" style="white-space:nowrap">'+esc(new Date(e.t).toLocaleTimeString())+'</td><td><b>'+esc(e.type)+'</b></td><td style="color:var(--text-2)">'+esc(e.detail||'')+'</td></tr>').join('')+

/* ===================== FSP notes ===================== */
function fspText(s){
  const t = gradables(s);
  const L = [];
  L.push(s.poaCode+' — '+s.poaName+' phase check ('+s.cert+')');
  L.push('Applicant: '+(s.applicant||'')+'   Date: '+s.date+'   Aircraft: '+(s.aircraft||'n/a'));
  L.push('Check instructor: '+(s.instructor||'')+'   Recommending instructor: '+(s.recInstructor||'not recorded'));
  if (s.startedAt){
    const sp = splitTimes(s);
    L.push('Ground time: '+hms(sp.ground)+'   Flight time: '+hms(sp.flight)+'   Total: '+(s.endedAt?hms(new Date(s.endedAt)-new Date(s.startedAt)):'n/a'));
    L.push('Ground audio recorded: '+hms((s.audio||[]).reduce((a,x)=>a+(x.ms||0),0)));
  }
  L.push('Outcome: '+(s.outcome||'pending'));
  const d1 = t.filter(i=>s.grades[i.id]===1), d2 = t.filter(i=>s.grades[i.id]===2);
  L.push('');
  L.push('RETEST REQUIRED (grade 1): '+(d1.length? '':'none'));
  d1.forEach(i=>L.push('  • '+i.label+(s.notes[i.id]?' — '+s.notes[i.id]:'')));
  L.push('MINOR, TO BE ADDRESSED (grade 2): '+(d2.length? '':'none'));
  d2.forEach(i=>L.push('  • '+i.label+(s.notes[i.id]?' — '+s.notes[i.id]:'')));
  if ((s.ktd||[]).length){
    L.push('');
    L.push('KNOWLEDGE TEST DEFICIENCIES ('+ktCovered(s)+' of '+s.ktd.length+' asked):');
    s.ktd.forEach(r=>{
      const info = ACS_INDEX[(r.area||'')+'.'+(r.task||'')];
      L.push('  '+((s.ktAsked||{})[r.code]?'[x]':'[ ]')+' '+r.code+(info? '  '+info.area+'.'+info.l+' '+info.t : '  (unmatched code)'));
    });
  }
  if (s.debrief){ L.push(''); L.push('DEBRIEF: '+s.debrief); }
  return L.join('\n');
}

/* ===================== PDF ===================== */
async function exportPDF(){
  const s = St.s;
  if (!window.jspdf || !window.jspdf.jsPDF){ flash('PDF library did not load in this view.','bad'); return; }
  const {jsPDF} = window.jspdf;
  const d = new jsPDF({unit:'pt', format:'letter'});
  const M=52, W=612-M*2, BOT=740;
  let y=M;
  const nl = n => { y += (n||0); if (y>BOT){ d.addPage(); y=M; } };
  const txt = (str, opt) => {
    opt = opt||{};
    d.setFont('helvetica', opt.bold?'bold':(opt.italic?'italic':'normal'));
    d.setFontSize(opt.size||10);
    d.setTextColor(opt.grey?110:20);
    const lines = d.splitTextToSize(String(str), opt.w||W);
    lines.forEach(l=>{ if (y>BOT){ d.addPage(); y=M; } d.text(l, opt.x||M, y); y += (opt.lh||(opt.size?opt.size*1.3:13)); });
  };
  const rule = () => { nl(4); d.setDrawColor(200); d.line(M,y,M+W,y); nl(10); };

  txt('RED ARROW FLIGHT ACADEMY', {bold:true, size:13});
  txt('Plan of Action — '+s.poaCode+' · '+s.poaName+'  ('+s.cert+')', {size:11});
  nl(4);
  txt('Applicant: '+(s.applicant||'')+'        Date: '+s.date, {size:10});
  txt('Aircraft: '+(s.aircraft||'n/a')+'        Check instructor: '+(s.instructor||''), {size:10});
  txt('Recommending instructor: '+(s.recInstructor||'not recorded'), {size:10});
  const recMs=(s.audio||[]).reduce((a,x)=>a+(x.ms||0),0);
  const sp = splitTimes(s);
  txt('GROUND TIME: '+hms(sp.ground)+'        FLIGHT TIME: '+hms(sp.flight)+
      '        Total: '+(s.endedAt?hms(new Date(s.endedAt)-new Date(s.startedAt)):'n/a'), {bold:true, size:10});
  txt('Ground audio: '+hms(recMs)+' in '+(s.audio||[]).length+' segment(s)'+
      '        Pauses: '+(s.events||[]).filter(e=>e.type==='pause').length+
      ' (auto-resumed '+(s.events||[]).filter(e=>e.type==='auto_resume').length+')', {size:9, grey:true});
  txt('OUTCOME: '+(s.outcome||'pending').toUpperCase(), {bold:true, size:11});
  rule();

  if ((s.ktd||[]).length){
    txt('Knowledge test deficiencies — '+ktCovered(s)+' of '+s.ktd.length+' asked', {bold:true, size:11});
    nl(2);
    s.ktd.forEach(r=>{
      const info = ACS_INDEX[(r.area||'')+'.'+(r.task||'')];
      txt(((s.ktAsked||{})[r.code]?'[x] ':'[ ] ')+r.code+'   '+(info? info.area+'.'+info.l+' — '+info.t : '(unmatched code)'), {size:9.5, x:M+8, w:W-8});
    });
    rule();
  }
  const KTM = ktMap(s);

  sectionsFor(s).forEach(sec=>{
    if (!sec.items.length) return;
    nl(6); txt(sec.title.toUpperCase(), {bold:true, size:10.5});
    nl(2);
    sec.items.forEach(it=>{
      if (it.type==='text') return;
      if (it.type==='check' || it.type==='qrcheck'){
        txt((s.checks[it.id]?'[x] ':'[ ] ')+it.label, {size:9.5, x:M+8, w:W-8, grey:!s.checks[it.id]});
        return;
      }
      if (it.type==='acstask'){
        const r = rollup(s, it), n = itemCounts(s, it);
        const kr = KTM[it.acs]||[];
        nl(4);
        txt((r? r+' '+GL[r].toUpperCase() : '— not graded')+'   '+it.label+'   ['+n.done+'/'+n.total+' elements]'+
            (kr.length? '   << KNOWLEDGE TEST: '+kr.map(x=>x.code).join(', ') : ''), {bold:true, size:9.5, x:M+8, w:W-8});
        (it.els||[]).forEach(e=>{
          const id = elId(it.acs, e[0]), g = s.grades[id], note = s.notes[id];
          if (!g && !note) return;
          txt((g||'-')+'  '+it.acs+'.'+e[0]+'  '+e[1], {size:8.5, x:M+20, w:W-20});
          if (note) txt('    note: '+note, {size:8.5, x:M+28, w:W-28, italic:true});
        });
        if (n.done < n.total) txt('('+(n.total-n.done)+' element(s) not graded)', {size:8, x:M+20, w:W-20, grey:true});
        if (s.notes[it.id]) txt('Task note: '+s.notes[it.id], {size:9, x:M+20, w:W-20, italic:true});
        return;
      }
      const g = s.grades[it.id];
      const kr = it.acs ? (KTM[it.acs]||[]) : [];
      txt((g? g+' '+GL[g].toUpperCase() : '— not graded')+'   '+it.label+(kr.length? '   << KNOWLEDGE TEST: '+kr.map(r=>r.code).join(', ') : ''), {bold:true, size:9.5, x:M+8, w:W-8});
      if (s.notes[it.id]) txt('Notes: '+s.notes[it.id], {size:9, x:M+20, w:W-20, italic:true});
      const picked = s.qs[it.id]||[];
      if (it.q && picked.length) picked.forEach(i=>txt('· '+it.q[i], {size:8.5, x:M+20, w:W-20, grey:true}));
      nl(2);
    });
  });

  if (s.debrief){ rule(); txt('Debrief', {bold:true, size:11}); nl(2); txt(s.debrief, {size:9.5}); }
  rule(); nl(14);
  txt('Check instructor signature: ______________________________        Date: ______________', {size:9.5});
  nl(20);
  txt('Applicant signature: ____________________________________        Date: ______________', {size:9.5});
  nl(16);
  txt('Retest: any unsatisfactory task will be retrained by the instructor and retested by the check instructor signing this plan of action.', {size:8, grey:true});

  const blob = d.output('blob');
  const name = (s.poaCode+'-'+s.poaName+'-'+(s.applicant||'applicant')+'-'+s.date).replace(/[^A-Za-z0-9\-_. ]/g,'').replace(/\s+/g,'_')+'.pdf';
  saveBlob(blob, name);
}

/* ===================== render ===================== */
function render(){
  const bar = $('#bar'), main = $('#main'), foot = $('#foot');
  bar.innerHTML = barHTML();
  let f = '';
  let html = '';
  if (St.view==='stats') html = statsHTML();
  else if (St.view==='home') html = homeHTML();
  else if (St.view==='setup') html = setupHTML();
  else if (St.view==='run'){ const r = runHTML(); html = r.main; f = r.foot; }
  else if (St.view==='done') html = doneHTML();
  if (St.needPin) html = '<div class="wrap" style="padding-block:14px 0"><div class="banner bad">'+
    '<span><b>The access code was rejected.</b> Everything you grade is being kept in this browser and will be sent up as soon as the code is accepted.<br>'+pinField()+'</span></div></div>' + html;
  if (St.note) html = '<div class="wrap" style="padding-block:14px 0"><div class="banner '+esc(St.note.kind)+'">'+
    '<span>'+esc(St.note.msg)+'</span></div></div>' + html;
  main.innerHTML = html;
  foot.innerHTML = f; foot.hidden = !f;
  $('#modal').innerHTML = St.modal || '';
  $$('textarea.note').forEach(autosize);
  $$('img.qrimg').forEach(im=>{
    const mark = () => { const b = im.closest('.qrbox'); if (b) b.classList.add('empty'); };
    im.addEventListener('error', mark);
    if (im.complete && !im.naturalWidth) mark();
  });
}
function autosize(t){ t.style.height='auto'; t.style.height = Math.min(320, Math.max(44, t.scrollHeight))+'px'; }

/* ===================== events ===================== */
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (['new','home','open','start'].indexOf(act)>-1) stopMeter();
  if (act==='new'){ St.s = null; St.view='setup'; render(); }
  else if (act==='pick'){
    const keep = St.s;
    St.s = newSession(b.dataset.id);
    if (keep){ St.s.applicant=keep.applicant; St.s.date=keep.date; St.s.aircraft=keep.aircraft; St.s.instructor=keep.instructor; St.s.ktd=keep.ktd; }
    render();
  }
  else if (act==='home'){
    if (St.s && St.s.status==='active'){ confirmModal('Leave the event running?','The event clock and recording keep running. You can reopen it from the records list.', ()=>{ St.view='home'; St.modal=null; render(); }); return; }
    St.s=null; St.view='home'; render();
  }
  else if (act==='open'){
    const row = St.list.filter(r=>r.id===b.dataset.id)[0];
    if (!row) return;
    St.s = JSON.parse(JSON.stringify(row));
    St.s.grades=St.s.grades||{}; St.s.notes=St.s.notes||{}; St.s.checks=St.s.checks||{}; St.s.qs=St.s.qs||{}; St.s.ktd=St.s.ktd||[]; St.s.ktAsked=St.s.ktAsked||{}; St.s.events=St.s.events||[]; St.s.audio=St.s.audio||[];
    Rec.seq = (St.s.audio||[]).reduce((a,x)=>Math.max(a,x.seq||0),0);
    St.view = St.s.status==='active' ? 'run' : 'done'; St.sec=0; render();
  }
  else if (act==='start'){ startEvent(); }
  else if (act==='sec'){ St.sec = +b.dataset.i; render(); window.scrollTo({top:0}); }
  else if (act==='next'){ St.sec = Math.min(sectionsFor(St.s).length-1, St.sec+1); render(); window.scrollTo({top:0}); }
  else if (act==='prev'){ St.sec = Math.max(0, St.sec-1); render(); window.scrollTo({top:0}); }
  else if (act==='grade'){
    const id = b.dataset.item, g = +b.dataset.g;
    St.s.grades[id] = (St.s.grades[id]===g) ? undefined : g;
    if (!St.s.grades[id]) delete St.s.grades[id];
    save();
    $$('[data-act="grade"][data-item="'+id+'"]').forEach(x=>x.setAttribute('aria-pressed', (+x.dataset.g===St.s.grades[id])?'true':'false'));
    const paint = (node) => {
      if (!node) return;
      node.classList.remove('g1','g2','g3');
      if (St.s.grades[id]) node.classList.add('g'+St.s.grades[id]);
    };
    paint($('#i-'+cssEsc(id)));
    paint($('#e-'+cssEsc(id)));
    const tk = taskOfEl(id);
    if (tk) patchAcsTask(tk);
    patchProgress();
  }
  else if (act==='elnote'){
    const id = b.dataset.id, row = $('#e-'+cssEsc(id));
    if (!row) return;
    let ta = row.querySelector('textarea[data-note]');
    if (ta){
      if (!ta.value.trim()){ ta.remove(); if (St.openNotes) delete St.openNotes[id]; b.textContent = '+ comment'; return; }
      ta.focus(); return;
    }
    St.openNotes = St.openNotes || {}; St.openNotes[id] = true;
    ta = document.createElement('textarea');
    ta.className = 'note elnote'; ta.rows = 1; ta.dataset.note = id;
    ta.placeholder = 'Comment…'; ta.value = St.s.notes[id] || '';
    row.appendChild(ta); autosize(ta); ta.focus();
  }
  else if (act==='stats'){ St.view='stats'; render(); window.scrollTo({top:0}); }
  else if (act==='testmic'){ testMic(); }
  else if (act==='setname'){
    const box = $('#ci-name');
    if (!box){ St.me.name=''; try{ localStorage.removeItem('epoa.ci'); }catch(e){} renderChk(); return; }
    const v = (box.value||'').trim();
    if (!v) return;
    St.me.name = v;
    try { localStorage.setItem('epoa.ci', v); } catch(e){}
    if (St.s && !St.s.instructor) { St.s.instructor = v; save(); }
    renderChk();
  }
  else if (act==='setapi'){
    const box = $('#api-url'); if (!box || !box.value.trim()) return;
    Api.setUrl(box.value); renderChk(); refreshList();
  }
  else if (act==='setpin'){
    const box = $('#api-pin');
    if (!box){ Api.setPin(''); renderChk(); return; }
    if (!box.value.trim()) return;
    Api.setPin(box.value); renderChk();
    (async()=>{
      try {
        await Api.call('ping'); Api.ok = true; St.needPin = false;
        const held = lsGet();
        const mine = Object.keys(held).map(k=>held[k]).filter(x=>x && x.status && x.status!=='draft');
        let sent = 0;
        for (const rec of mine){ try { await Api.call('save', {session:rec}); sent++; } catch(err){ break; } }
        flash('Connected to the school records.'+(sent? ' '+sent+' held record'+(sent===1?'':'s')+' sent up.':''),'info');
      } catch(e){ Api.ok = false; }
      render(); refreshList();
    })();
  }
  else if (act==='ping'){
    (async()=>{ try { await Api.call('ping'); Api.ok=true; } catch(e){ Api.ok=false; } renderChk(); })();
  }
  else if (act==='recstart'){
    const ok = await recStart();
    if (ok) logEv('audio_start','Ground recording started');
    else flash('Audio recording could not start — check that this view is allowed to use the microphone.','warn');
    render();
  }
  else if (act==='pause'){ recPause(); }
  else if (act==='resume'){ recResume(false); }
  else if (act==='groundend'){
    confirmModal('End the ground portion?',
      'Ground time is stamped at '+hms(splitTimes(St.s).ground)+' and the audio stops. The flight portion runs from here with no recording, and the clock keeps going. This cannot be undone for this event.', ()=>{
      St.s.groundEndedAt = new Date().toISOString();
      St.s.groundMs = splitTimes(St.s).ground;
      recStopAll('Ground portion complete — ground time '+hms(St.s.groundMs));
      St.modal=null; save(true); render();
    });
  }
  else if (act==='endevent'){
    const pr = progress(St.s);
    confirmModal('End the event?', (pr.done<pr.total? (pr.total-pr.done)+' of '+pr.total+' tasks are still ungraded. ':'')+'Recording stops and the event moves to debrief.', ()=>{ St.modal=null; endEvent(); });
  }
  else if (act==='outcome'){ St.s.outcome = St.s.outcome===b.dataset.o ? '' : b.dataset.o; save(); render(); }
  else if (act==='finalize'){ finalize(); render(); }
  else if (act==='pdf'){ exportPDF(); }
  else if (act==='copyfsp'){
    const ta = $('#fsp');
    try { await navigator.clipboard.writeText(ta.value); flash('Notes copied.','info'); }
    catch(err){ ta.removeAttribute('readonly'); ta.select(); document.execCommand&&document.execCommand('copy'); ta.setAttribute('readonly',''); flash('Notes selected — copy with your keyboard if the copy button is blocked.','info'); }
  }
  else if (act==='dlseg'){
    const blob = LocalAudio[+b.dataset.seq];
    if (!blob) return;
    saveBlob(blob, 'ground-audio-seg'+b.dataset.seq+(Rec.mime.indexOf('mp4')>-1?'.m4a':'.webm'));
  }
  else if (act==='ktadd'){
    const box = $('#kt-paste');
    const found = parseKT((box&&box.value)||'');
    if (!found.length){ flash('No ACS codes recognized — they look like PA.I.B.K1.','warn'); return; }
    const have = {}; (St.s.ktd||[]).forEach(r=>have[r.code]=true);
    const add = found.filter(r=>!have[r.code]);
    St.s.ktd = (St.s.ktd||[]).concat(add);
    if (box) box.value='';
    save(); render();
    flash(add.length+' code'+(add.length===1?'':'s')+' added'+(found.length-add.length? ', '+(found.length-add.length)+' already on the list':'')+'.','info');
  }
  else if (act==='ktdeltask'){
    const tk = b.dataset.tk;
    St.s.ktd = (St.s.ktd||[]).filter(r=>{
      const hit = (r.area+'.'+r.task)===tk;
      if (hit && St.s.ktAsked) delete St.s.ktAsked[r.code];
      return !hit;
    });
    save(); render();
  }
  else if (act==='ktdelun'){
    St.s.ktd = (St.s.ktd||[]).filter(r=>!!ACS_INDEX[(r.area||'')+'.'+(r.task||'')]);
    save(); render();
  }
  else if (act==='ktclear'){
    confirmModal('Clear all knowledge test codes?','Every flagged task loses its required questions. Grades and notes are kept.', ()=>{
      St.s.ktd=[]; St.s.ktAsked={}; St.modal=null; save(); render();
    });
  }
  else if (act==='gosec'){
    const i = sectionsFor(St.s).findIndex(x=>x.id===b.dataset.sid);
    if (i>-1){ St.sec=i; render(); window.scrollTo({top:0}); }
  }
  else if (act==='cancel-modal'){ St.modal=null; render(); }
  else if (act==='ok-modal'){ if (ModalOK) ModalOK(); }
});
function cssEsc(s){ return String(s).replace(/[^A-Za-z0-9_-]/g, c=>'\\'+c); }
/* refresh one ACS task's rollup chip, counts and group tallies in place */
function patchAcsTask(tk){
  const s = St.s;
  let item = null, sec = null;
  sectionsFor(s).forEach(x => x.items.forEach(i => { if (i.acs === tk){ item = i; sec = x; } }));
  if (!item) return;
  const node = $('#i-'+cssEsc(item.id));
  if (!node) return;
  const r = rollup(s, item), n = itemCounts(s, item);
  node.classList.remove('g1','g2','g3');
  if (r) node.classList.add('g'+r);
  const chips = node.querySelectorAll('.acsh .chip');
  const head = node.querySelector('.acsh');
  if (head){
    const keep = head.querySelector('h3').outerHTML;
    head.innerHTML = keep + '<span class="spacer"></span>' +
      (r? '<span class="chip g'+r+'">'+r+' '+GL[r]+'</span>' : '') +
      '<span class="chip'+(n.done===n.total?' g3':'')+'">'+n.done+'/'+n.total+'</span>';
  }
  node.querySelectorAll('details.grp').forEach(d => {
    const k = (d.dataset.grp||'').split(':')[1];
    const list = (item.els||[]).filter(e => e[0][0] === k);
    const done = list.filter(e => s.grades[elId(tk, e[0])]).length;
    const c = d.querySelector('.cnt');
    if (c){ c.textContent = done+'/'+list.length; c.classList.toggle('ok', done===list.length); }
  });
}
function patchProgress(){
  const pr = progress(St.s);
  const bar = $('.prog i'); if (bar) bar.style.width = pr.pct+'%';
  const m = $('.foot .mini'); if (m) m.textContent = pr.done+'/'+pr.total+' graded';
  const secs = sectionsFor(St.s);
  $$('.nav button').forEach((btn,i)=>{
    const d = secDone(St.s, secs[i]), kp = secKtPending(St.s, secs[i]);
    btn.classList.toggle('done', d);
    const st = btn.querySelector('.st');
    if (st) st.innerHTML = kp ? '<span class="ktdot">'+kp+'</span>' : (d?'✓':'');
  });
}

document.addEventListener('change', e=>{
  const t = e.target;
  if (t.dataset && t.dataset.kc!=null){
    St.s.ktAsked = St.s.ktAsked || {};
    if (t.checked) St.s.ktAsked[t.dataset.kc]=true; else delete St.s.ktAsked[t.dataset.kc];
    t.closest('label').classList.toggle('on', t.checked);
    save();
    const item = t.closest('.item'), bar = item && item.querySelector('.ktbar');
    if (bar){
      const boxes = Array.from(item.querySelectorAll('input[data-kc]'));
      const pend = boxes.filter(x=>!x.checked).length;
      bar.innerHTML = '<span class="chip g2">Knowledge test</span>'+
        (pend? pend+' of '+boxes.length+' required question'+(boxes.length>1?'s':'')+' still to ask' : 'all required questions asked');
    }
    patchProgress();
  }
  else if (t.dataset && t.dataset.chk!=null){
    const id=t.dataset.chk;
    if (t.checked) St.s.checks[id]=true; else delete St.s.checks[id];
    t.closest('label').classList.toggle('on', t.checked);
    save(); patchProgress();
  } else if (t.dataset && t.dataset.q!=null){
    const id=t.dataset.q, i=+t.dataset.qi;
    const arr = St.s.qs[id] || (St.s.qs[id]=[]);
    const k = arr.indexOf(i);
    if (t.checked && k<0) arr.push(i); else if (!t.checked && k>-1) arr.splice(k,1);
    arr.sort((a,b)=>a-b);
    t.closest('label').classList.toggle('on', t.checked);
    const wrap = t.closest('.qbank'), cnt = wrap && wrap.querySelector('.pickcount');
    if (cnt){
      const item = tasksOf(St.s).filter(x=>x.id===id)[0] || {q:[]};
      const need = item.pick||0;
      cnt.textContent = arr.length+' / '+item.q.length+' asked';
      cnt.classList.toggle('ok', need? arr.length>=need : arr.length>0);
    }
    save();
  } else if (t.dataset && t.dataset.sf){
    St[t.dataset.sf] = t.value; render();
  } else if (t.dataset && t.dataset.f){
    St.s[t.dataset.f] = t.value; save();
  }
});
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.dataset && t.dataset.note!=null){
    St.s.notes[t.dataset.note] = t.value; autosize(t); save();
    const row = t.closest('.el'), nb = row && row.querySelector('.nb');
    if (nb) nb.textContent = t.value.trim() ? 'note ✎' : '+ comment';
  }
  else if (t.dataset && t.dataset.f){ St.s[t.dataset.f] = t.value; save(); }
});
/* remember which element groups are open, so grading doesn't collapse them */
document.addEventListener('toggle', e=>{
  const d = e.target;
  if (!d || !d.dataset || !d.dataset.grp) return;
  St.openGrp = St.openGrp || {};
  if (d.open) St.openGrp[d.dataset.grp] = true; else delete St.openGrp[d.dataset.grp];
}, true);

window.addEventListener('beforeunload', e=>{
  if (St.s && St.s.status==='active'){ e.preventDefault(); e.returnValue=''; }
});

let ModalOK = null;
function confirmModal(title, body, ok){
  ModalOK = ok;
  St.modal = '<div class="modal"><div class="box"><h3>'+esc(title)+'</h3><p>'+esc(body)+'</p>'+
    '<div class="row" style="justify-content:flex-end"><button class="btn ghost" data-act="cancel-modal">Cancel</button>'+
    '<button class="btn primary" data-act="ok-modal">Continue</button></div></div></div>';
  render();
}


async function refreshList(){
  const local = lsGet();
  if (!Api.url() || !Api.pin()){ Api.ok = false; render(); return; }
  try {
    const r = await Api.call('list');
    Api.ok = true;
    const byId = {};
    Object.keys(local).forEach(k=>byId[k]=local[k]);
    (r.sessions||[]).forEach(v=>{ if (v && v.id) byId[v.id]=v; });
    St.list = Object.keys(byId).map(k=>byId[k]);
  } catch(e){ Api.ok = false; }
  render();
}

/* ===================== boot ===================== */
render();
(async function boot(){
  const local = lsGet();
  St.list = Object.keys(local).map(k=>local[k]);
  try { St.me.name = localStorage.getItem('epoa.ci') || ''; } catch(e){}
  render();
  await refreshList();
  /* push anything this browser saved while the sheet was unreachable */
  const mine = Object.keys(local).map(k=>local[k]).filter(x=>x && x.status && x.status!=='draft');
  if (Api.ok && mine.length){
    for (const s of mine){
      try { await Api.call('save', {session:s}); } catch(e){ break; }
    }
    await refreshList();
  }
})();
})();

</script>
